# ---------------------------------------------------------------------------
# Perfil test — pruebas automáticas.
#
# Corre contra el MISMO contenedor MySQL que ya usás para probar a mano, pero
# sobre un schema aparte (zolea_test), así los datos de demo quedan intactos.
# El schema se crea solo la primera vez, gracias a createDatabaseIfNotExist.
#
#   docker compose up -d db     tiene que estar arriba
#   ./mvnw test
#
# Si Docker está apagado, las pruebas no corren: es la misma condición que ya
# tenés hoy para probar la app a mano.
#
# create-drop: el esquema se arma y se tira en cada corrida, así que las pruebas
# nunca dependen de lo que dejó la anterior.
# mode=never: los datos de demo NO se cargan. Cada prueba arma los suyos, que es
# lo que las hace legibles (se ve en el test qué situación se está probando) y
# lo que evita que un cambio en el seed rompa pruebas que no tienen que ver.
# ---------------------------------------------------------------------------

# Credenciales LITERALES, no ${MYSQL_USER}/${MYSQL_PASSWORD}, y es a propósito.
#
# application.properties importa el .env del proyecto, que no está versionado y
# tiene las credenciales de la base de desarrollo de cada uno. Si las pruebas
# leyeran de ahí, pasarían o fallarían según la máquina: de hecho fallaban, porque
# la contraseña del .env no es la del contenedor de docker-compose, y como la
# propiedad EXISTE el valor por defecto nunca se aplicaba.
#
# Estos valores son los que declara docker-compose.yml para el servicio db, que sí
# está versionado. No son un secreto: es una base de pruebas local y efímera.
spring.datasource.url=jdbc:mysql://localhost:3307/zolea_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Sin esto, cualquier prueba que genere un JWT falla por secreto corto.
JWT_SECRET=clave-solo-para-pruebas-de-al-menos-32-caracteres
MP_ACCESS_TOKEN=TEST-token-de-prueba-no-se-usa
NGROK_BASE_URL=http://localhost:8080
FRONTEND_URL=http://localhost:4200

# Estadísticas de Hibernate: las usa QueryCountTest para contar cuántas consultas
# dispara un endpoint. Es la única forma de que una mejora de N+1 quede probada con
# un número en lugar de afirmada de palabra. Solo en pruebas: tiene costo.
spring.jpa.properties.hibernate.generate_statistics=true
