# ---------------------------------------------------------------------------
# Perfil dev — desarrollo local.
#
# La base es SIEMPRE el MySQL de docker-compose, que publica el 3306 del
# contenedor en el 3307 del host justamente para no chocar con un MySQL
# instalado en la máquina.
#
#   docker compose up -d db     levanta solo la base
#   docker compose up -d        levanta base + backend
#
# ---------------------------------------------------------------------------
# Credenciales LITERALES, no ${MYSQL_URL}/${MYSQL_USER}/${MYSQL_PASSWORD}, por
# el mismo motivo que en application-test.properties.
#
# application.properties importa el .env del proyecto con
# spring.config.import, así que lo que ese archivo define pasa a ser una
# propiedad de Spring. Y un default entre llaves —${MYSQL_URL:...}— solo se
# aplica cuando la propiedad NO EXISTE: si el .env define MYSQL_URL, el valor
# por defecto no se usa nunca, aunque apunte a otra base.
#
# Eso es lo que pasaba: el .env apuntaba al MySQL local del puerto 3306, que
# puede no estar corriendo o no tener el schema, y la aplicación fallaba al
# arrancar con "Unable to determine Dialect" —que no es un problema de
# Hibernate, es que no se pudo conectar—. El perfil de pruebas ya lo esquivaba;
# este no.
#
# Los valores de acá son los que docker-compose.yml le da al servicio db, que
# sí está versionado. No son un secreto: es una base local de desarrollo.
#
# Para apuntar a otra base sin tocar este archivo, se pisa el datasource por
# variable de entorno, que gana sobre los archivos de configuración:
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#
# El .env sigue haciendo falta para lo que sí es secreto o propio de cada
# máquina: MP_ACCESS_TOKEN, JWT_SECRET, NGROK_BASE_URL y FRONTEND_URL.
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:mysql://localhost:3307/zolea_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Datos de demostración: se recargan en cada arranque, a propósito, para partir
# siempre del mismo estado conocido. Ver la cabecera de data-demo.sql.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-demo.sql
