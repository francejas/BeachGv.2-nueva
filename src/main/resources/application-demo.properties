# ---------------------------------------------------------------------------
# Perfil demo — despliegue de demostración (EC2 + docker-compose).
#
# El backend corre dentro de la red de Compose, así que la base se alcanza por
# el nombre del servicio ("db") y por el puerto interno 3306, no por el 3307
# que Compose publica hacia afuera.
#
# Igual que dev, RECARGA LOS DATOS DE DEMO EN CADA ARRANQUE: reiniciar el
# contenedor borra todo lo que se haya cargado a mano, incluidas las reservas
# creadas durante una prueba. Es deliberado, para que la demo sea reproducible.
# Si en algún momento hace falta preservar datos, el cambio es poner
# spring.sql.init.mode=never acá.
# ---------------------------------------------------------------------------

spring.datasource.url=${MYSQL_URL:jdbc:mysql://db:3306/zolea_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-demo.sql
