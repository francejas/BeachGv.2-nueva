spring.application.name=backend

# ---------------------------------------------------------------------------
# Configuración común a todos los perfiles.
#
# Perfiles disponibles:
#   dev   Desarrollo local contra el MySQL de docker-compose (puerto 3307).
#         Carga los datos de demo en cada arranque. Es el perfil por defecto.
#   demo  Despliegue de demostración (EC2 + docker-compose). Igual que dev pero
#         apuntando al host "db" de la red de Compose.
#   test  Pruebas automáticas. Schema aparte (zolea_test), esquema recreado en
#         cada corrida y SIN datos de demo: cada prueba arma los suyos.
#         Vive en src/test/resources, así que no viaja en el jar.
#
# Para elegir uno: --spring.profiles.active=demo, o SPRING_PROFILES_ACTIVE=demo
# como variable de entorno (es lo que hace docker-compose.yml).
# ---------------------------------------------------------------------------
spring.profiles.default=dev

# Las credenciales reales viven en .env, que no está versionado. Es opcional:
# los perfiles traen valores por defecto para que un clone limpio arranque.
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate gestiona el esquema a partir de las entidades.
# FASE 3 — pasa a "validate" cuando Flyway tome el control del esquema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Apagado. Cuando vale true, Spring deja la sesión de base abierta durante toda la
# petición, así que cualquier colección LAZY se carga sola en el momento en que se
# la recorre, incluso desde la capa de presentación. Es cómodo y por eso es el
# valor por defecto, pero tiene dos costos: la conexión queda tomada mientras se
# serializa la respuesta, y —sobre todo— el límite de la transacción lo termina
# poniendo un filtro web en vez del caso de uso.
#
# El sistema DEPENDÍA de esto: los mappers de los servicios recorrían colecciones
# LAZY sin ninguna transacción declarada. Se pudo apagar recién después de poner
# @Transactional(readOnly = true) en los servicios, que es lo que mete el mapeo
# adentro de la transacción. Invertir ese orden rompe cuatro endpoints de una con
# LazyInitializationException; LecturasHttpTest es la prueba que lo detecta.
spring.jpa.open-in-view=false

# Necesario para que los datos de demo se inserten DESPUÉS de que Hibernate
# haya creado las tablas.
spring.jpa.defer-datasource-initialization=true
